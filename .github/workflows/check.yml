name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  legacy-basic:
    name: legacy Ant 1.5.4 / Ivy 2.4.0 / Java 6 (x86-64 Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Allow isolated native control processes
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cat > "$RUNNER_TEMP/legacy-unshare" <<'SH'
          #!/bin/sh
          exec unshare --user --map-root-user "$@"
          SH
          chmod +x "$RUNNER_TEMP/legacy-unshare"
      - name: Native controls, cold lifecycle, negatives, updates, pure build and rebuild
        run: |
          python3 -B tests/legacy-basic/check.py \
            --output "$RUNNER_TEMP/ant-legacy-evidence" \
            --namespace-tools "$RUNNER_TEMP/legacy-unshare" \
            --ip "$(command -v ip)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ant-legacy-basic-x86_64-linux
          path: ${{ runner.temp }}/ant-legacy-evidence
          if-no-files-found: error
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/eval-errors.py
      - run: nix flake check -L
      - run: tests/conformance-rebuild.sh
  conformance:
    name: conformance-${{ matrix.case }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        case: [relock, update, external, native]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/host-conformance.py "${{ matrix.case }}"
  composition-native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 tests/composition-native.py
